# Put these locations inside the existing Studio server block.
# Replace studio.example.com with your Studio domain.
# Provider traffic stays server-side behind the authenticated /studio-api endpoint.

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; base-uri 'self'; frame-ancestors 'self' https://ohlao.cfd https://www.ohlao.cfd" always;

location = /studio {
    return 301 /studio/;
}

location = /studio/admin {
    return 301 /studio/admin.html;
}

location /studio/ {
    alias /var/www/image-agent-studio/;
    index studio.html;
    try_files $uri $uri/ /studio/studio.html;
    # Embedded launches contain a short-lived parent token on the first request.
    access_log off;
}

location ~ ^/studio/(cases\.json|inspirations\.json|inspiration-sources\.json|style-library\.json)$ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 404;
}

location /studio/studio-assets/ {
    alias /var/www/image-agent-studio/studio-assets/;
    try_files $uri =404;
    access_log off;
    expires 30d;
}

location /studio/images/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 404;
}

location /studio-api/ {
    proxy_pass http://127.0.0.1:8787/studio-api/;
    proxy_http_version 1.1;
    client_max_body_size 120m;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
